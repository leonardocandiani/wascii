name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  width-check:
    name: every block ≤ 26 cells
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check ASCII block widths (R1)
        run: python3 scripts/check-width.py
